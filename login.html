<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in to MotoLog</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="MotoLog" />
    <meta property="og:description" content="Every ride logged. Every service on time." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="nav scrolled">
      <div class="container nav-inner">
        <a href="/" class="brand" aria-label="MotoLog home">
          <img src="/motolog-icon.png" alt="" width="32" height="32" />
          <span>MotoLog</span>
        </a>
        <a href="/" class="btn btn-ghost">Back to site</a>
      </div>
    </header>

    <main class="login">
      <div class="container login-inner">
        <p class="label">Rider account</p>
        <h1>Log in</h1>
        <p class="login-intro">See the services, mileage and trips you have logged in the MotoLog app.</p>

        <form class="login-form" id="login-form" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit" class="btn btn-dark">Log in</button>
          <p class="login-note" id="login-note" role="status" aria-live="polite">
            Online accounts are coming soon. For now, your data is in the MotoLog app on your phone.
          </p>
        </form>
      </div>
    </main>

    <script type="module" src="/src/login.js"></script>
  </body>
</html>

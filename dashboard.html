<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your garage | MotoLog</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="nav scrolled">
      <div class="container nav-inner">
        <a href="/" class="brand" aria-label="MotoLog home">
          <img src="/motolog-icon.png" alt="" width="32" height="32" />
          <span>MotoLog</span>
        </a>
        <div class="dash-user">
          <span class="dash-email" id="user-email"></span>
          <button type="button" class="btn btn-ghost" id="sign-out">Sign out</button>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <div class="container">
        <p class="label">Your garage</p>
        <h1>Your bikes</h1>
        <p class="dash-intro">The services, mileage and trips you have logged in the MotoLog app.</p>
        <p class="dash-state" id="dash-state" role="status" aria-live="polite">Loading your garage…</p>
        <div class="garage" id="garage"></div>
      </div>
    </main>

    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
